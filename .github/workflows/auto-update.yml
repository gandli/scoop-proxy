name: Auto-update manifests

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Scoop
        shell: pwsh
        run: |
          irm get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          Remove-Item .\install-scoop.ps1

      - name: Update manifests
        shell: pwsh
        run: |
          $checkver = "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1"
          & $checkver -Dir "$env:GITHUB_WORKSPACE\bucket" -Update

      - name: Fill hashes for updated manifests
        shell: pwsh
        run: |
          $changed = @(git status --porcelain bucket) | ForEach-Object { $_.Substring(3).Trim() }
          foreach ($file in $changed) {
            "Computing hashes for $file"
            $m = Get-Content $file -Raw | ConvertFrom-Json
            foreach ($prop in $m.architecture.PSObject.Properties) {
              $url = ($prop.Value.url -split '#')[0]
              $tmp = Join-Path $env:TEMP ([IO.Path]::GetFileName($url))
              Invoke-WebRequest -Uri $url -OutFile $tmp -UserAgent 'Scoop'
              $prop.Value.hash = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToLower()
              Remove-Item $tmp -Force
            }
            $m | ConvertTo-Json -Depth 32 | Set-Content $file -Encoding utf8NoBOM
          }

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $updated = @()
          foreach ($file in (git status --porcelain bucket | ForEach-Object { $_.Substring(3).Trim() })) {
            git add $file
            $name = [IO.Path]::GetFileNameWithoutExtension($file)
            $version = (Get-Content $file -Raw | ConvertFrom-Json).version
            git commit -m "$name`: update to version $version"
            $updated += "$name $version"
          }
          if ($updated) {
            git push
            "Updated: $($updated -join ', ')"
          } else {
            "No manifest updates available."
          }
