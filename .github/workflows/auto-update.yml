name: Auto-update manifests

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Scoop
        shell: pwsh
        run: |
          irm get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          Remove-Item .\install-scoop.ps1

      - name: Update manifests
        id: checkver
        continue-on-error: true
        shell: powershell
        run: |
          $checkver = "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1"
          & $checkver -Dir "$env:GITHUB_WORKSPACE\bucket" -Update *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'checkver.log')

      - name: Fill and validate hashes
        id: fill
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = New-Object System.Collections.Generic.List[string]
          $notes = New-Object System.Collections.Generic.List[string]

          # checkver skips a manifest it cannot update (dead asset, moved release) and only logs an
          # ERROR line; without this the bucket would silently go stale.
          $checkverLog = Join-Path $env:RUNNER_TEMP 'checkver.log'
          if (Test-Path $checkverLog) {
            Get-Content $checkverLog | Where-Object { $_ -match '^\s*ERROR\s+(.+)$' } | ForEach-Object {
              $failures.Add("checkver: " + ($_ -replace '^\s*ERROR\s+', ''))
            }
          }

          function Get-VersionParts([string]$v) { @([regex]::Matches($v, '\d+') | ForEach-Object { [long]$_.Value }) }

          # Returns 1 when $new is newer, -1 when older, 0 when equal, $null when unparseable.
          function Compare-Version([string]$old, [string]$new) {
            $o = @(Get-VersionParts $old)
            $n = @(Get-VersionParts $new)
            if (-not $o.Count -or -not $n.Count) { return $null }
            for ($i = 0; $i -lt [Math]::Max($o.Count, $n.Count); $i++) {
              $ov = if ($i -lt $o.Count) { $o[$i] } else { 0 }
              $nv = if ($i -lt $n.Count) { $n[$i] } else { 0 }
              if ($nv -gt $ov) { return 1 }
              if ($nv -lt $ov) { return -1 }
            }
            return 0
          }

          # Windows PowerShell 5.1 turns a native command's stderr into a terminating error whenever
          # $ErrorActionPreference is 'Stop', so a benign non-zero exit (unknown tag, path not in HEAD)
          # would abort the whole manifest instead of falling through to the next strategy.
          function Invoke-Native([string]$exe, [string[]]$arguments) {
            $previous = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $output = & $exe @arguments 2>$null
              if ($LASTEXITCODE -ne 0) { return $null }
              return ($output -join "`n")
            } finally {
              $ErrorActionPreference = $previous
            }
          }

          # Read the digest out of the JSON payload instead of filtering it with --jq. PowerShell 5.1
          # drops the inner double quotes from arguments handed to native executables, so any jq
          # expression carrying a string literal reaches gojq unquoted and fails to parse.
          function Get-GitHubAssetDigest([string]$owner, [string]$repo, [string]$tag, [string]$asset) {
            $json = Invoke-Native 'gh' @('api', "repos/$owner/$repo/releases/tags/$tag")
            if (-not $json) { return $null }
            try {
              $release = $json | ConvertFrom-Json
              $match = @($release.assets | Where-Object { $_.name -eq $asset })
              if ($match.Count -gt 0 -and $match[0].digest) { return [string]$match[0].digest }
            } catch { }
            return $null
          }

          function Get-AssetHash([string]$url) {
            $clean = ($url -split '#')[0]
            # Prefer the authoritative digest published by GitHub for release assets.
            if ($clean -match '^https://github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/(.+)$') {
              $owner = $Matches[1]; $repo = $Matches[2]; $tag = $Matches[3]; $asset = $Matches[4]
              $digest = Get-GitHubAssetDigest $owner $repo $tag $asset
              if ($digest -match '^sha256:([0-9a-fA-F]{64})$') { return $Matches[1].ToLower() }
            }
            # Fallback: download (retried, size + content sanity checked).
            for ($i = 1; $i -le 3; $i++) {
              try {
                $tmp = Join-Path $env:TEMP ("au-" + [IO.Path]::GetFileName($clean))
                $r = Invoke-WebRequest -Uri $clean -OutFile $tmp -UserAgent 'Mozilla/5.0 (compatible; Scoop)' -MaximumRedirection 5 -TimeoutSec 600 -UseBasicParsing -PassThru
                $len = (Get-Item $tmp).Length
                $head = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($tmp)[0..([Math]::Min(255, $len - 1))])
                if ($len -lt 512) { throw "response too small ($len bytes)  -  probably an error page" }
                if ($head -match '(?i)<!doctype|<html|<head>|access denied|<error') { throw "response looks like HTML, not a binary asset" }
                $h = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToLower()
                Remove-Item $tmp -Force -ErrorAction SilentlyContinue
                return $h
              } catch {
                Write-Warning "hash attempt ${i} failed for $clean : $($_.Exception.Message)"
                Start-Sleep -Seconds (5 * $i)
              }
            }
            throw "could not compute hash for $clean"
          }

          function Test-UrlAlive([string]$url) {
            $clean = ($url -split '#')[0]
            for ($i = 1; $i -le 3; $i++) {
              try {
                # -UseBasicParsing is required: without it Windows PowerShell 5.1 parses via the IE
                # engine and throws a NullReferenceException on redirected HEAD responses.
                Invoke-WebRequest -Uri $clean -Method Head -UserAgent 'Mozilla/5.0 (compatible; Scoop)' -MaximumRedirection 5 -TimeoutSec 90 -UseBasicParsing -ErrorAction Stop | Out-Null
                return $true
              } catch {
                $code = 0
                try { $code = [int]$_.Exception.Response.StatusCode } catch {}
                # Only 404/410 mean the asset is really gone. Release URLs redirect to a CDN, and a
                # rejected probe (401/403/405/429), a CDN 5xx or a dropped connection must not revert
                # a healthy manifest.
                if ($code -eq 404 -or $code -eq 410) { return $false }
                if ($code -ne 0) { return $true }
                # No status at all: prove reachability with a one-byte ranged GET.
                try {
                  Invoke-WebRequest -Uri $clean -Method Get -Headers @{ Range = 'bytes=0-0' } -UserAgent 'Mozilla/5.0 (compatible; Scoop)' -MaximumRedirection 5 -TimeoutSec 90 -UseBasicParsing -ErrorAction Stop | Out-Null
                  return $true
                } catch {
                  $getCode = 0
                  try { $getCode = [int]$_.Exception.Response.StatusCode } catch {}
                  if ($getCode -eq 404 -or $getCode -eq 410) { return $false }
                  if ($getCode -ne 0) { return $true }
                }
                Start-Sleep -Seconds (3 * $i)
              }
            }
            return $false
          }

          # Structural guard: every manifest must parse, whether it changed or not. A file broken
          # before the run (bad encoding, truncated write) would otherwise stay silently green.
          $bucketDir = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          Get-ChildItem $bucketDir -Filter *.json | ForEach-Object {
            $head = [IO.File]::ReadAllBytes($_.FullName)
            if ($head.Length -ge 2 -and (($head[0] -eq 0xFF -and $head[1] -eq 0xFE) -or ($head[0] -eq 0xFE -and $head[1] -eq 0xFF))) {
              $failures.Add("$($_.Name): manifest is UTF-16, must be UTF-8")
              return
            }
            try { [IO.File]::ReadAllText($_.FullName) | ConvertFrom-Json | Out-Null }
            catch { $failures.Add("$($_.Name): manifest is not valid JSON ($($_.Exception.Message))") }
          }

          $changed = @(git status --porcelain bucket | ForEach-Object { $_.Substring(3).Trim() })
          foreach ($file in $changed) {
            $ok = $false
            try {
              $m = Get-Content $file -Raw | ConvertFrom-Json

              # Never publish a version regression: upstream feeds (e.g. redirect-based
              # installers) sometimes serve an older build than the one already recorded.
              $headRaw = Invoke-Native 'git' @('show', ('HEAD:' + ($file -replace '\\', '/')))
              $oldVersion = $null
              if ($headRaw) {
                try { $oldVersion = ($headRaw | ConvertFrom-Json).version } catch { $oldVersion = $null }
              }
              if ($oldVersion) {
                $cmp = Compare-Version $oldVersion $m.version
                if ($cmp -eq -1) {
                  throw "version regression rejected: $oldVersion -> $($m.version)"
                }
                if ($null -eq $cmp -and $oldVersion -ne $m.version) {
                  $notes.Add("$([IO.Path]::GetFileName($file)): uncomparable version change $oldVersion -> $($m.version) (accepted)")
                }
              }

              $urls = @()
              if ($m.PSObject.Properties['url']) { $urls += [pscustomobject]@{ Url = $m.url; Obj = $m } }
              foreach ($prop in $m.architecture.PSObject.Properties) {
                $urls += [pscustomobject]@{ Url = $prop.Value.url; Obj = $prop.Value }
              }
              if (-not $urls) { throw "manifest has no url" }
              foreach ($entry in $urls) {
                if (-not $entry.Url) { throw "architecture entry has no url" }
                "Computing hash for $file -> $($entry.Url)"
                $h = Get-AssetHash $entry.Url
                if ($h -notmatch '^[0-9a-f]{64}$') { throw "computed hash is not a sha256 ($h)" }
                $entry.Obj | Add-Member -NotePropertyName hash -NotePropertyValue $h -Force
                if (-not (Test-UrlAlive $entry.Url)) { throw "url is not reachable: $($entry.Url)" }
              }
              foreach ($field in 'version', 'description', 'homepage', 'license', 'checkver', 'autoupdate') {
                if (-not $m.PSObject.Properties[$field]) { throw "missing required field '$field'" }
              }
              $json = ($m | ConvertTo-Json -Depth 32) + "`r`n"
              [IO.File]::WriteAllText((Resolve-Path $file).Path, $json, (New-Object System.Text.UTF8Encoding($false)))
              $ok = $true
            } catch {
              $message = $_.Exception.Message
              if ($message -like 'version regression rejected*') {
                # Upstream anomaly, not a bucket defect: revert quietly, keep the run green.
                $notes.Add("$([IO.Path]::GetFileName($file)): $message")
                Write-Warning "$file : $message"
              } else {
                $failures.Add("$([IO.Path]::GetFileName($file)): $message")
                Write-Warning "validation failed for $file : $message"
              }
            }
            if (-not $ok) { git checkout -- $file }
          }

          if ($notes.Count -gt 0) {
            $notes | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'notes.txt') -Encoding UTF8
            $notes | ForEach-Object { "::warning::$_" }
          }

          if ($failures.Count -gt 0) {
            $path = Join-Path $env:RUNNER_TEMP 'failures.txt'
            $failures | Set-Content -Path $path -Encoding UTF8
            "::error::Auto-update validation failed for $($failures.Count) manifest(s)"
            exit 1
          }

      - name: Commit changes
        id: commit
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $updated = @()
          foreach ($file in @(git status --porcelain bucket | ForEach-Object { $_.Substring(3).Trim() })) {
            git add $file
            $name = [IO.Path]::GetFileNameWithoutExtension($file)
            $version = (Get-Content $file -Raw | ConvertFrom-Json).version
            git commit -m "$name`: update to version $version"
            $updated += "$name $version"
          }
          if ($updated) {
            git push
            "Updated: $($updated -join ', ')" | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'updated.txt')
          } else {
            "No manifest updates available."
          }

      - name: Report outcome
        if: always()
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = '[auto-update]'
          $failures = @()
          $failPath = Join-Path $env:RUNNER_TEMP 'failures.txt'
          if (Test-Path $failPath) { $failures = @(Get-Content $failPath | Where-Object { $_.Trim() }) }
          $checkverFailed = '${{ steps.checkver.outcome }}' -ne 'success'
          $fillFailed = '${{ steps.fill.outcome }}' -ne 'success'
          $commitFailed = '${{ steps.commit.outcome }}' -ne 'success'
          $updatedPath = Join-Path $env:RUNNER_TEMP 'updated.txt'
          $updated = if (Test-Path $updatedPath) { (Get-Content $updatedPath -Raw).Trim() } else { '' }
          $notesPath = Join-Path $env:RUNNER_TEMP 'notes.txt'
          $notes = if (Test-Path $notesPath) { @(Get-Content $notesPath | Where-Object { $_.Trim() }) } else { @() }

          $label = 'maintenance'
          & gh label create $label --repo $repo --color B60205 --description 'Automated maintenance failures' 2>&1 | Out-Null

          # Track the open issue by title prefix, not by search syntax: search failures used to make
          # recovery silently no-op. Every gh call is pinned to the repo explicitly.
          $open = @()
          $raw = (& gh issue list --repo $repo --label $label --state open --json number,title) -join "`n"
          if ($raw.Trim()) {
            $open = @($raw | ConvertFrom-Json | Where-Object { $_.title.Contains($tag) } | ForEach-Object { $_.number })
          }
          "Open tracker issues: $($open -join ', ')"

          $problems = @()
          if ($checkverFailed) { $problems += '- the `checkver` step failed - no manifests could be scanned.' }
          if ($fillFailed -and $failures.Count -eq 0) { $problems += '- the validation step crashed before it could report details (see the job log).' }
          if ($commitFailed) { $problems += '- `git push` failed - commits were not published.' }
          foreach ($f in $failures) { $problems += "- $f" }

          if ($problems.Count -eq 0) {
            foreach ($n in $open) {
              & gh issue comment $n --repo $repo --body "Recovered: the latest auto-update run succeeded. Closing." | Out-Null
              & gh issue close $n --repo $repo | Out-Null
            }
            if ($updated) { "Auto-update OK: $updated" } else { "Auto-update OK: no upstream changes." }
            foreach ($n in $notes) { "Note: $n" }
            exit 0
          }

          $noteBlock = ''
          if ($notes.Count) { $noteBlock = "`nRejected but not blocking:`n" + (($notes | ForEach-Object { "- $_" }) -join "`n") }
          $body = @"
          The scheduled auto-update run ended with problems. Manifests listed below were **reverted** and were not published, so the bucket stays installable; the remaining manifests were updated normally. The next scheduled run retries automatically.

          $($problems -join "`n")
          $noteBlock

          Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@
          if ($open.Count -gt 0) {
            foreach ($n in $open) { & gh issue comment $n --repo $repo --body $body | Out-Null }
            "Commented on issue(s): $($open -join ', ')"
          } else {
            $created = (& gh issue create --repo $repo --title "$tag scheduled run needs attention" --label $label --body $body) -join "`n"
            "Created issue: $created"
          }
          "::error::$($problems.Count) problem(s) reported to the issue tracker"
          exit 1
