name: Auto-update manifests

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Scoop
        shell: pwsh
        run: |
          irm get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          Remove-Item .\install-scoop.ps1

      - name: Update manifests
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $checkver = "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1"
          & $checkver -Dir "$env:GITHUB_WORKSPACE\bucket" -Update

      - name: Fill hashes for updated manifests
        shell: powershell
        run: |
          function Get-UrlHash([string]$url) {
            $tmp = Join-Path $env:TEMP ([IO.Path]::GetFileName(($url -split '#')[0]))
            Invoke-WebRequest -Uri ($url -split '#')[0] -OutFile $tmp -UserAgent 'Scoop'
            $h = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToLower()
            Remove-Item $tmp -Force
            return $h
          }
          $changed = @(git status --porcelain bucket) | ForEach-Object { $_.Substring(3).Trim() }
          foreach ($file in $changed) {
            "Computing hashes for $file"
            $m = Get-Content $file -Raw | ConvertFrom-Json
            # top-level url (installer-style manifests, e.g. uu-remote)
            if ($m.PSObject.Properties['url'] -and -not $m.hash) {
              $m | Add-Member -NotePropertyName hash -NotePropertyValue (Get-UrlHash $m.url) -Force
            }
            foreach ($prop in $m.architecture.PSObject.Properties) {
              if (-not $prop.Value.hash) {
                $prop.Value | Add-Member -NotePropertyName hash -NotePropertyValue (Get-UrlHash $prop.Value.url) -Force
              }
            }
            $json = ($m | ConvertTo-Json -Depth 32) + "`r`n"
            [IO.File]::WriteAllText((Resolve-Path $file).Path, $json, (New-Object System.Text.UTF8Encoding($false)))
          }

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $updated = @()
          foreach ($file in (git status --porcelain bucket | ForEach-Object { $_.Substring(3).Trim() })) {
            git add $file
            $name = [IO.Path]::GetFileNameWithoutExtension($file)
            $version = (Get-Content $file -Raw | ConvertFrom-Json).version
            git commit -m "$name`: update to version $version"
            $updated += "$name $version"
          }
          if ($updated) {
            git push
            "Updated: $($updated -join ', ')"
          } else {
            "No manifest updates available."
          }
