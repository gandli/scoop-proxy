name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    # Weekly drift check: catches dead upstream links and hash rot even when no manifest changed.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@v4
        with:
          # Need at least 2 commits to properly gather changed files for linting
          fetch-depth: 2
          path: 'my_bucket'
      - name: Checkout Scoop
        uses: actions/checkout@v4
        with:
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'
      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@v6.3
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: ${{ matrix.shell }}
      - name: Run tests
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1

  deep-test:
    name: Deep test
    runs-on: windows-latest
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@v4
        with:
          path: 'my_bucket'
      - name: Checkout Scoop
        uses: actions/checkout@v4
        with:
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'
      - name: Run deep tests (liveness + autoupdate expansion)
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\deep-test.ps1

  report:
    name: Report CI outcome
    needs: [test, deep-test]
    if: |
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: windows-latest
    steps:
      - name: Update issue tracker
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RESULT: ${{ needs.test.result }}
          DEEP_RESULT: ${{ needs.deep-test.result }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = '[ci]'
          $label = 'maintenance'
          & gh label create $label --repo $repo --color B60205 --description 'Automated maintenance failures' 2>&1 | Out-Null

          $open = @()
          $raw = (& gh issue list --repo $repo --label $label --state open --json number,title) -join "`n"
          if ($raw.Trim()) {
            $open = @($raw | ConvertFrom-Json | Where-Object { $_.title.Contains($tag) } | ForEach-Object { $_.number })
          }

          $green = ($env:TEST_RESULT -eq 'success' -and $env:DEEP_RESULT -eq 'success')
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          if ($green) {
            foreach ($n in $open) {
              & gh issue comment $n --repo $repo --body "Recovered: CI is green on $env:GITHUB_SHA. Closing." | Out-Null
              & gh issue close $n --repo $repo | Out-Null
            }
            "CI green ($run)"
            exit 0
          }

          $body = @"
          CI is failing on ``$env:GITHUB_SHA``.

          - Pester suite: $env:TEST_RESULT
          - Deep test (liveness / autoupdate expansion): $env:DEEP_RESULT

          Run: $run
          "@
          if ($open.Count -gt 0) {
            foreach ($n in $open) { & gh issue comment $n --repo $repo --body $body | Out-Null }
          } else {
            & gh issue create --repo $repo --title "$tag bucket checks are failing" --label $label --body $body | Out-Null
          }
          "::error::CI failed - issue tracker updated ($run)"
          exit 1
