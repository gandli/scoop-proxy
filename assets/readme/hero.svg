<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">scoop-proxy</title>
  <desc id="hero-desc">scoop-proxy：收录代理工具的 Scoop bucket。左侧为项目名、简介与代理链路示意，右侧终端演示添加 bucket 与安装 mihomo 的真实输出。</desc>

  <rect width="1200" height="380" rx="14" fill="#0B0F14"/>

  <g id="title-block" transform="translate(64 56)">
    <text x="0" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="3" fill="#8B949E">SCOOP BUCKET · PROXY TOOLS FOR WINDOWS</text>

    <text x="0" y="94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="62" font-weight="700" fill="#E6EDF3">scoop-proxy</text>

    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#C9D1D9">一个 Scoop bucket：代理内核、GUI 客户端与</text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#C9D1D9">WireGuard 组网工具，manifest 每日自动更新</text>

    <text x="0" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#4ADE80">● 24 APPS · DAILY AUTO-UPDATE · CI DEEP-TESTED</text>

    <g id="route-motif" transform="translate(0 292)">
      <line x1="0" y1="0" x2="500" y2="0" stroke="#30363D" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#0B0F14" stroke="#8B949E" stroke-width="1.5"/>
      <rect x="242" y="-8" width="16" height="16" rx="3" transform="rotate(45 250 0)" fill="#0B0F14" stroke="#58A6FF" stroke-width="1.5"/>
      <circle cx="500" cy="0" r="6" fill="#0B0F14" stroke="#8B949E" stroke-width="1.5"/>
      <circle cx="125" cy="0" r="4" fill="#4ADE80"/>
      <circle cx="375" cy="0" r="4" fill="#4ADE80"/>
      <text x="0" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6E7681">本地</text>
      <text x="250" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6E7681">节点</text>
      <text x="500" y="28" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6E7681">出口</text>
    </g>
  </g>

  <g id="terminal" transform="translate(672 44)">
    <rect width="464" height="272" rx="10" fill="#0D1117" stroke="#263041" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#FF5F56"/>
    <circle cx="42" cy="21" r="6" fill="#FFBD2E"/>
    <circle cx="60" cy="21" r="6" fill="#27C93F"/>
    <line x1="0" y1="40" x2="464" y2="40" stroke="#21262D" stroke-width="1"/>

    <text x="24" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18"><tspan fill="#6E7681">PS&gt; </tspan><tspan fill="#E6EDF3">scoop bucket add proxy</tspan></text>
    <text x="64" y="99" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B949E">github.com/gandli/scoop-proxy</text>
    <text x="24" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#4ADE80">✓ bucket 'proxy' added</text>
    <text x="24" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18"><tspan fill="#6E7681">PS&gt; </tspan><tspan fill="#E6EDF3">scoop install proxy/mihomo</tspan></text>
    <text x="24" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B949E">Installing 'mihomo' (1.19.34) [64bit]</text>
    <text x="24" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#4ADE80">✓ mihomo (1.19.34) installed</text>
    <text x="24" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#6E7681">PS&gt;</text>
    <rect x="66" y="219" width="9" height="20" fill="#4ADE80"/>
  </g>
</svg>
